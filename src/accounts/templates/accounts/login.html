{% extends "auth_base.html" %}

{% block title %}Giris Yap | BidLance{% endblock %}

{% block content %}
<h1 class="h3 mb-3">Giris yap</h1>
<p class="text-muted mb-4">Hesabina girerek tekliflerini ve urunlerini yonet.</p>

{% if error %}
    <div class="alert alert-danger">{{ error }}</div>
{% endif %}

<form method="POST" class="d-grid gap-3" id="loginForm">
    {% csrf_token %}
    <div>
        <label class="form-label" for="username">Kullanici adi</label>
        <input class="form-control" id="username" type="text" name="username" autocomplete="username" required>
    </div>
    <div>
        <label class="form-label" for="password">Sifre</label>
        <input class="form-control" id="password" type="password" name="password" autocomplete="current-password" required>
    </div>
    <button class="btn btn-primary btn-lg" type="submit">Giris yap</button>
</form>

<p class="text-muted mt-4 mb-0">
    Hesabin yok mu? <a href="{% url 'register' %}">Kayit ol</a>
</p>

<script>
    document.getElementById('loginForm').addEventListener('submit', async function (event) {
        event.preventDefault();

        const form = event.currentTarget;
        const button = form.querySelector('button[type="submit"]');
        button.disabled = true;

        try {
            const response = await fetch(form.action || window.location.href, {
                method: 'POST',
                body: new FormData(form),
                credentials: 'same-origin',
                headers: {
                    'X-Requested-With': 'XMLHttpRequest'
                }
            });

            if (response.redirected && !response.url.includes('/accounts/login/')) {
                window.location.href = "{% url 'products:urun_kategori_incele' %}";
                return;
            }

            const html = await response.text();
            document.open();
            document.write(html);
            document.close();
        } catch (error) {
            form.submit();
        } finally {
            button.disabled = false;
        }
    });
</script>
{% endblock %}
