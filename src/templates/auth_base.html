<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}BidLance{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            background: #f7f7f8;
            display: grid;
            place-items: center;
            font-family: Arial, Helvetica, sans-serif;
        }

        .auth-card {
            width: min(440px, calc(100vw - 32px));
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            padding: 32px;
        }

        .brand {
            color: #3665f3;
            font-size: 32px;
            font-weight: 800;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <main class="auth-card shadow-sm">
        <a class="brand d-inline-block mb-4" href="{% url 'products:urun_kategori_incele' %}">BidLance</a>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
