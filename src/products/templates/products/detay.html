{% extends 'base.html' %}

{% block content %}
<div class="container mt-5">
    <!-- Geri Dön Butonu -->
    <div class="mb-4">
    <a href="javascript:history.back()" class="btn btn-outline-secondary">
        &larr; Geri Dön
    </a>
</div>

    <div class="row">
        <!-- Sol Taraf: Ürün Görseli -->
        <div class="col-md-6 mb-4">
            <div class="card shadow-sm">
                <div class="card-body text-center">
                    {% if urun.gorsel %}
                        <img src="{{ urun.gorsel.url }}" class="img-fluid rounded" alt="{{ urun.ad }}" style="max-height: 500px; object-fit: contain;">
                    {% else %}
                        <img src="https://via.placeholder.com/600x400?text=Görsel+Yok" class="img-fluid rounded">
                    {% endif %}
                </div>
            </div>
        </div>

        <!-- Sağ Taraf: Ürün Bilgileri -->
        <div class="col-md-6">
            <h1 class="fw-bold display-5">{{ urun.ad }}</h1>
            
            {% if urun.kategori %}
                <p class="text-muted fs-5">Kategori: <span class="badge bg-secondary">{{ urun.kategori.ad }}</span></p>
            {% endif %}
            
            <hr>
            
            <!-- Açıklama Kısmı -->
            <h4 class="mt-3">Ürün Detayları</h4>
            <p class="fs-6 lh-lg">{{ urun.aciklama }}</p>
            
            <div class="card mt-5 border-success shadow-sm">
                <div class="card-body text-center bg-light">
                    <h5 class="card-title text-muted mb-2">Başlangıç Fiyatı</h5>
                    <h2 class="card-text text-success fw-bold mb-4">{{ urun.baslangicFiyati }} ₺</h2>
                    
                    <button class="btn btn-success btn-lg w-100" disabled>
                        Teklif Ver (Çok Yakında)
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
